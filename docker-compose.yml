services:
  mysql:
    image: mysql:8.0
    container_name: coffee-pos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: coffee_pos
      MYSQL_USER: coffee_user
      MYSQL_PASSWORD: coffee_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [coffee-net]

  flask:
    build: ./app
    container_name: coffee-pos-flask
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: coffee_pos
      DB_USER: coffee_user
      DB_PASSWORD: coffee_password
      SECRET_KEY: change-this-secret-key
      PUBLIC_BASE_URL: http://192.168.178.59:8080
    depends_on:
      mysql:
        condition: service_healthy
    networks: [coffee-net]

  nginx:
    image: nginx:alpine
    container_name: coffee-pos-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [flask]
    networks: [coffee-net]

volumes:
  mysql_data:

networks:
  coffee-net:
