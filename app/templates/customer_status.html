{% extends "customer_base.html" %}{% block content %}<section class="status-page"><p class="kicker">ORDER #{{ order.id }}</p><h1>Your order status</h1><div id="status-card" class="big-status status-{{ order.status }}"><span id="status-icon">☕</span><strong id="status-text">{{ order.status|title }}</strong><p id="status-help">We are checking your order.</p></div><a class="primary-button link-button" href="/table/{{ order.table_id }}">Back to menu</a></section><script>const id={{ order.id }};const help={new:'Your order reached the kitchen.',preparing:'The kitchen is preparing your order.',ready:'Your order is ready.',completed:'Your order has been served.',cancelled:'This order was cancelled.'};async function update(){const r=await fetch(`/api/order/${id}/status`);if(!r.ok)return;const o=await r.json();document.getElementById('status-text').textContent=o.status[0].toUpperCase()+o.status.slice(1);document.getElementById('status-help').textContent=help[o.status];document.getElementById('status-card').className=`big-status status-${o.status}`;}update();setInterval(update,4000);</script>{% endblock %}
