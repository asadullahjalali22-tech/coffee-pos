{% extends "base.html" %}{% block content %}<div class="page-heading"><div><h2>Live Kitchen Display</h2><p>Updates automatically every 5 seconds.</p></div><span id="live-status" class="badge badge-success">Live</span></div><div id="kitchen-board" class="orders-grid"></div><script>
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadOrders(){const r=await fetch('/api/kitchen/orders');if(!r.ok)return;const orders=await r.json();const board=document.getElementById('kitchen-board');board.innerHTML='';orders.forEach(o=>{let next=o.status==='new'?'preparing':o.status==='preparing'?'ready':'completed';let label=o.status==='new'?'Start preparing':o.status==='preparing'?'Mark ready':'Complete';const card=document.createElement('article');card.className=`order-card status-${o.status} wait-${o.waiting_minutes>=15?'late':o.waiting_minutes>=8?'warn':'ok'}`;card.innerHTML=`<div class="order-header"><h3>Order #${o.id}</h3><span>${esc(o.source)}</span></div><div class="wait-timer">Waiting ${o.waiting_minutes} min</div><ul>${o.items.map(i=>`<li>${i.quantity} × ${esc(i.name)}</li>`).join('')}</ul>${o.customer_comment?`<p class="comment"><strong>Comment:</strong> ${esc(o.customer_comment)}</p>`:''}<form method="post" action="/orders/${o.id}/status"><input type="hidden" name="status" value="${next}"><button class="button full">${label}</button></form>`;board.appendChild(card)});if(!orders.length)board.innerHTML='<div class="billing-empty"><h3>No active orders</h3></div>'}
loadOrders();setInterval(loadOrders,5000);</script>{% endblock %}
