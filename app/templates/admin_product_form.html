{% extends "base.html" %}{% block content %}
<div class="form-page"><div class="page-heading"><h2>{{ page_title }}</h2><a class="button secondary" href="/admin/products">Back</a></div>
{% if error %}<div class="alert">{{ error }}</div>{% endif %}
<form class="admin-form" method="post"><label>Name</label><input name="name" value="{{ product.name if product else '' }}" required>
<label>Category</label><select name="category_id">{% for c in categories %}<option value="{{ c.id }}" {% if product and product.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select>
<label>Price</label><input name="price" type="number" min="0" step="0.01" value="{{ product.price if product else '' }}" required>
<label>Description</label><textarea name="description">{{ product.description if product and product.description else '' }}</textarea>
<label class="checkbox-row"><input type="checkbox" name="available" {% if not product or product.available %}checked{% endif %}>Available</label>
<button class="button full">Save Product</button></form></div>{% endblock %}
